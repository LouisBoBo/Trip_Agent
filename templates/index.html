<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多智能体对话系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background-color: #ffffff;
            color: #333;
            overflow: hidden;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            height: 100vh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
        }
        .header {
            text-align: center;
            padding: 40px 20px 30px;
            flex-shrink: 0;
        }
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .logo {
            font-size: 32px;
        }
        .title {
            font-size: 28px;
            font-weight: 600;
            color: #1a1a1a;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: 0;
        }
        .message {
            display: flex;
            flex-direction: column;
        }
        .message.user {
            align-items: flex-end;
        }
        .message.ai {
            align-items: flex-start;
        }
        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .message.user .message-bubble {
            background-color: #007AFF;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }
        .message.ai .message-bubble {
            background-color: #f5f5f5;
            color: #333;
            border-bottom-left-radius: 4px;
        }
        .message-time {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
            padding: 0 4px;
        }
        .input-container {
            padding: 20px 0;
            flex-shrink: 0;
            background-color: #ffffff;
        }
        .input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .input-box {
            position: relative;
            background-color: #f5f5f5;
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            min-height: 56px;
        }
        #messageInput {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 16px;
            font-family: inherit;
            resize: none;
            outline: none;
            color: #333;
            line-height: 1.5;
            max-height: 200px;
            overflow-y: auto;
        }
        #messageInput::placeholder {
            color: #999;
        }
        .input-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .icon-btn, .send-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .send-btn {
            background-color: #007AFF;
            color: #ffffff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            padding: 10px;
        }
        .send-btn:hover {
            background-color: #0056b3;
        }
        .voice-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .voice-btn:hover {
            background-color: #e8e8e8;
        }
        .voice-btn.recording {
            color: #ff3b30;
            background-color: #ffebee;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .voice-status {
            font-size: 12px;
            color: #ff3b30;
            text-align: center;
            margin-top: 4px;
            min-height: 16px;
        }
        .input-options {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .option-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background-color: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            color: #666;
            transition: all 0.2s;
        }
        .option-btn:hover {
            background-color: #e8e8e8;
        }
        .option-btn.active {
            background-color: #007AFF;
            color: #ffffff;
            border-color: #007AFF;
        }
        .loading {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }
        .loading-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #999;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部标题区域 -->
        <div class="header">
            <div class="logo-container">
                <div class="logo">🐋</div>
                <h1 class="title">旅行智能助手</h1>
            </div>
        </div>

        <!-- 聊天消息区域 -->
        <div class="chat-container" id="chatContainer">
            <!-- 消息将动态添加到这里 -->
        </div>

        <!-- 输入区域 -->
        <div class="input-container">
            <div class="input-wrapper">
                <div class="input-box">
                    <textarea 
                        id="messageInput" 
                        placeholder="给 AI 发送消息" 
                        rows="1"
                        autofocus
                    ></textarea>
                    <div class="input-actions">
                        <button class="voice-btn" id="voiceBtn" title="语音输入">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                                <line x1="12" y1="19" x2="12" y2="23"></line>
                                <line x1="8" y1="23" x2="16" y2="23"></line>
                            </svg>
                        </button>
                        <button class="icon-btn" id="attachBtn" title="附件">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                            </svg>
                        </button>
                        <button class="send-btn" id="sendBtn" title="发送">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="voice-status" id="voiceStatus"></div>
                <div class="input-options">
                    <button class="option-btn" id="deepThinkBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                            <path d="M2 17l10 5 10-5"></path>
                            <path d="M2 12l10 5 10-5"></path>
                        </svg>
                        <span>深度思考</span>
                    </button>
                    <button class="option-btn" id="webSearchBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="2" y1="12" x2="22" y2="12"></line>
                            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                        </svg>
                        <span>联网搜索</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let sessionId = null;
        let isDeepThink = false;
        let isWebSearch = false;

        // DOM 元素（将在DOMContentLoaded中初始化）
        let chatContainer, messageInput, sendBtn, attachBtn, deepThinkBtn, webSearchBtn, voiceBtn, voiceStatus;
        
        // 语音识别相关变量
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let currentStream = null; // 保存当前的音频流
        
        // 使用Web Audio API直接录制WAV格式（避免转换）
        let audioContext = null;
        let scriptProcessor = null;
        let audioBufferArray = [];
        let useDirectWavRecording = false; // 是否使用直接WAV录制

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            console.log('页面加载完成，开始初始化...');
            
            // 获取DOM元素
            chatContainer = document.getElementById('chatContainer');
            messageInput = document.getElementById('messageInput');
            sendBtn = document.getElementById('sendBtn');
            attachBtn = document.getElementById('attachBtn');
            deepThinkBtn = document.getElementById('deepThinkBtn');
            webSearchBtn = document.getElementById('webSearchBtn');
            voiceBtn = document.getElementById('voiceBtn');
            voiceStatus = document.getElementById('voiceStatus');
            
            // 检查元素是否存在
            if (!chatContainer || !messageInput || !sendBtn) {
                console.error('无法找到必要的DOM元素');
                console.log('chatContainer:', chatContainer);
                console.log('messageInput:', messageInput);
                console.log('sendBtn:', sendBtn);
                return;
            }
            
            console.log('DOM元素获取成功');
            
            // 创建新会话
            createNewSession();
            
            // 绑定事件
            sendBtn.addEventListener('click', sendMessage);
            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            // 自动调整输入框高度
            messageInput.addEventListener('input', () => {
                messageInput.style.height = 'auto';
                messageInput.style.height = messageInput.scrollHeight + 'px';
            });
            
            // 选项按钮
            if (deepThinkBtn) {
                deepThinkBtn.addEventListener('click', () => {
                    isDeepThink = !isDeepThink;
                    deepThinkBtn.classList.toggle('active', isDeepThink);
                });
            }
            
            if (webSearchBtn) {
                webSearchBtn.addEventListener('click', () => {
                    isWebSearch = !isWebSearch;
                    webSearchBtn.classList.toggle('active', isWebSearch);
                });
            }
            
            // 附件按钮
            if (attachBtn) {
                attachBtn.addEventListener('click', () => {
                    alert('附件功能暂未实现');
                });
            }
            
            // 初始化语音识别
            initSpeechRecognition();
            
            console.log('初始化完成');
        });

        // 创建新会话
        async function createNewSession() {
            try {
                const response = await fetch('/api/session/new', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();
                sessionId = data.session_id;
                console.log('会话创建成功:', sessionId);
            } catch (error) {
                console.error('创建会话失败:', error);
            }
        }

        // 发送消息
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;
            
            console.log('发送消息:', message);
            
            // 禁用输入和发送按钮
            messageInput.disabled = true;
            sendBtn.disabled = true;
            
            // 添加用户消息到界面
            addMessage(message, 'user');
            
            // 清空输入框
            messageInput.value = '';
            messageInput.style.height = 'auto';
            
            // 显示加载动画
            const loadingId = addLoadingMessage();
            
            try {
                // 构建请求体
                const requestBody = {
                    message: message,
                    session_id: sessionId
                };
                
                // 发送请求
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });
                
                const data = await response.json();
                console.log('收到回复:', data);
                
                // 移除加载动画
                removeLoadingMessage(loadingId);
                
                // 添加AI回复
                if (data.response) {
                    addMessage(data.response, 'ai');
                } else if (data.error) {
                    addMessage('抱歉，发生了错误：' + data.error, 'ai');
                } else {
                    addMessage('抱歉，没有收到回复', 'ai');
                }
                
                // 更新会话ID（如果返回了新的）
                if (data.session_id) {
                    sessionId = data.session_id;
                }
                
            } catch (error) {
                console.error('发送消息失败:', error);
                removeLoadingMessage(loadingId);
                addMessage('抱歉，网络错误，请稍后重试', 'ai');
            } finally {
                // 恢复输入和发送按钮
                messageInput.disabled = false;
                sendBtn.disabled = false;
                messageInput.focus();
            }
        }

        // 添加消息到界面
        function addMessage(content, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = content;
            
            const time = document.createElement('div');
            time.className = 'message-time';
            time.textContent = getCurrentTime();
            
            messageDiv.appendChild(bubble);
            messageDiv.appendChild(time);
            
            chatContainer.appendChild(messageDiv);
            
            // 滚动到底部
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            return messageDiv;
        }

        // 添加加载动画
        function addLoadingMessage() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai';
            messageDiv.id = 'loading-' + Date.now();
            
            const loading = document.createElement('div');
            loading.className = 'loading';
            loading.innerHTML = `
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
            `;
            
            messageDiv.appendChild(loading);
            chatContainer.appendChild(messageDiv);
            
            // 滚动到底部
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            return messageDiv.id;
        }

        // 移除加载动画
        function removeLoadingMessage(loadingId) {
            const loadingElement = document.getElementById(loadingId);
            if (loadingElement) {
                loadingElement.remove();
            }
        }

        // 获取当前时间
        function getCurrentTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            return `${hours}:${minutes}`;
        }

        // 初始化语音识别（使用智谱AI后端API）
        function initSpeechRecognition() {
            // 检查浏览器是否支持MediaRecorder
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                console.warn('当前浏览器不支持录音功能');
                if (voiceBtn) {
                    voiceBtn.style.display = 'none';
                }
                return;
            }

            // 绑定语音按钮点击事件
            if (voiceBtn) {
                voiceBtn.addEventListener('click', toggleSpeechRecognition);
            }
        }

        // 切换语音识别（录音）
        async function toggleSpeechRecognition() {
            console.log('[toggleSpeechRecognition] 点击语音按钮，isRecording:', isRecording);
            try {
                if (isRecording) {
                    // 停止录音
                    console.log('[toggleSpeechRecognition] 停止录音');
                    stopRecording();
                } else {
                    // 开始录音
                    console.log('[toggleSpeechRecognition] 开始录音');
                    await startRecording();
                }
            } catch (error) {
                console.error('[toggleSpeechRecognition] 错误:', error);
                if (voiceStatus) {
                    voiceStatus.textContent = '录音失败: ' + error.message;
                    setTimeout(() => {
                        if (voiceStatus) voiceStatus.textContent = '';
                    }, 3000);
                }
            }
        }

        // 获取浏览器支持的音频格式
        function getSupportedMimeType() {
            // 优先尝试智谱AI支持的格式：wav和mp3
            // 注意：大多数浏览器不支持直接录制wav/mp3，但如果支持就优先使用
            const types = [
                'audio/wav',
                'audio/wave',
                'audio/x-wav',
                'audio/mpeg',
                'audio/mp3',
                // 如果都不支持，使用webm（后续需要转换）
                'audio/webm;codecs=opus',
                'audio/webm',
                'audio/ogg;codecs=opus'
            ];
            
            for (let type of types) {
                if (MediaRecorder.isTypeSupported(type)) {
                    console.log('支持的音频格式:', type);
                    // 如果是wav或mp3格式，直接返回
                    if (type.includes('wav') || type.includes('wave') || type.includes('mpeg') || type.includes('mp3')) {
                        return type;
                    }
                    // 否则继续查找
                }
            }
            
            // 如果找到了webm等格式，返回它（后续需要转换）
            for (let type of types) {
                if (MediaRecorder.isTypeSupported(type)) {
                    console.log('使用浏览器支持的格式（需要转换）:', type);
                    return type;
                }
            }
            
            // 如果都不支持，返回空字符串，让浏览器使用默认格式
            console.warn('未找到明确支持的格式，使用浏览器默认格式');
            return '';
        }

        // 将webm/ogg音频转换为wav格式（优化版本：压缩和降采样以提高速度）
        async function convertToWav(audioBlob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        // 添加超时保护（缩短到5秒，转换应该很快）
                        const timeoutId = setTimeout(() => {
                            reject(new Error('音频转换超时，请尝试更短的录音'));
                        }, 5000); // 5秒超时
                        
                        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        const audioBuffer = await audioContext.decodeAudioData(e.target.result);
                        
                        clearTimeout(timeoutId);
                        
                        // 极速优化：直接使用原始音频，不重采样（重采样很慢）
                        // 智谱AI支持多种采样率，不需要强制重采样
                        // 只做单声道转换（如果需要且很快）
                        let processedBuffer = audioBuffer;
                        
                        // 只在多声道时转换为单声道（使用第一个声道，最快方式）
                        if (audioBuffer.numberOfChannels > 1) {
                            console.log(`转换为单声道: ${audioBuffer.numberOfChannels}声道 -> 单声道`);
                            
                            // 直接使用第一个声道创建单声道buffer（不混合，最快）
                            const channel0 = audioBuffer.getChannelData(0);
                            const monoBuffer = audioContext.createBuffer(
                                1, 
                                audioBuffer.length, 
                                audioBuffer.sampleRate
                            );
                            monoBuffer.copyToChannel(channel0, 0);
                            processedBuffer = monoBuffer;
                        }
                        
                        // 将AudioBuffer转换为WAV格式
                        const wavBuffer = audioBufferToWav(processedBuffer);
                        const wavBlob = new Blob([wavBuffer], { type: 'audio/wav' });
                        
                        // 关闭AudioContext释放资源
                        await audioContext.close();
                        
                        console.log('音频已转换为WAV格式，大小:', wavBlob.size, '字节 (', (wavBlob.size / 1024).toFixed(2), 'KB), 采样率:', processedBuffer.sampleRate);
                        
                        // 检查文件大小（智谱AI限制25MB）
                        const maxSize = 25 * 1024 * 1024;
                        if (wavBlob.size > maxSize) {
                            reject(new Error(`音频文件过大 (${(wavBlob.size / 1024 / 1024).toFixed(2)}MB)，请缩短录音时长`));
                            return;
                        }
                        
                        resolve(wavBlob);
                    } catch (error) {
                        console.error('转换音频格式失败:', error);
                        reject(error);
                    }
                };
                reader.onerror = (e) => {
                    console.error('读取音频文件失败:', e);
                    reject(new Error('读取音频文件失败'));
                };
                reader.readAsArrayBuffer(audioBlob);
            });
        }

        // AudioBuffer转换为WAV格式的工具函数
        function audioBufferToWav(buffer) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const format = 1; // PCM
            const bitDepth = 16;
            
            const length = buffer.length * numChannels * 2 + 44;
            const arrayBuffer = new ArrayBuffer(length);
            const view = new DataView(arrayBuffer);
            const samples = new Int16Array(arrayBuffer, 44);
            
            // WAV文件头
            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };
            
            writeString(0, 'RIFF');
            view.setUint32(4, length - 8, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, format, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * numChannels * 2, true);
            view.setUint16(32, numChannels * 2, true);
            view.setUint16(34, bitDepth, true);
            writeString(36, 'data');
            view.setUint32(40, length - 44, true);
            
            // 转换音频数据
            for (let channel = 0; channel < numChannels; channel++) {
                const channelData = buffer.getChannelData(channel);
                for (let i = 0; i < channelData.length; i++) {
                    const sample = Math.max(-1, Math.min(1, channelData[i]));
                    samples[i * numChannels + channel] = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                }
            }
            
            return arrayBuffer;
        }

        // 开始录音
        async function startRecording() {
            try {
                // 如果正在录音，先停止
                if (isRecording) {
                    stopRecording();
                    // 等待一小段时间确保停止完成
                    await new Promise(resolve => setTimeout(resolve, 100));
                }
                
                // 请求麦克风权限
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });
                
                // 保存stream引用
                currentStream = stream;
                
                // 清空之前的音频数据
                audioChunks = [];
                audioBufferArray = [];
                
                // 清理之前的AudioContext（如果存在）
                if (audioContext && audioContext.state !== 'closed') {
                    audioContext.close();
                }
                audioContext = null;
                scriptProcessor = null;
                useDirectWavRecording = false; // 暂时禁用Web Audio API，只使用MediaRecorder
                
                // 使用MediaRecorder进行录音（稳定可靠）
                const mimeType = getSupportedMimeType();
                const options = mimeType ? { mimeType: mimeType } : {};
                mediaRecorder = new MediaRecorder(stream, options);
                console.log('[startRecording] MediaRecorder已创建，状态:', mediaRecorder.state, '类型:', mimeType || '默认');
                
                // 使用MediaRecorder进行录音
                // 录音错误处理
                mediaRecorder.onerror = (event) => {
                    console.error('[MediaRecorder] 错误:', event.error);
                    isRecording = false;
                    if (voiceStatus) {
                        voiceStatus.textContent = '录音出错: ' + event.error.message;
                        setTimeout(() => {
                            if (voiceStatus) voiceStatus.textContent = '';
                        }, 3000);
                    }
                };
                
                // 录音结束
                mediaRecorder.onstop = async () => {
                    console.log('[MediaRecorder] 录音已停止，音频块数量:', audioChunks.length);
                    // 停止所有音频轨道
                    if (currentStream) {
                        currentStream.getTracks().forEach(track => {
                            track.stop();
                            console.log('已停止音频轨道:', track.kind);
                        });
                        currentStream = null;
                    }
                    
                    // 上传音频并识别
                    await uploadAndRecognize();
                };
                
                // 录音数据收集
                mediaRecorder.ondataavailable = (event) => {
                    console.log('[MediaRecorder] 接收到音频数据，大小:', event.data.size);
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };
                
                // 开始录音，每200ms收集一次数据
                mediaRecorder.start(200);
                isRecording = true;
                
                // 限制录音时长：30秒（智谱AI限制）
                const maxRecordingTime = 30000; // 30秒
                setTimeout(() => {
                    if (isRecording && mediaRecorder && mediaRecorder.state !== 'inactive') {
                        console.log('[startRecording] 达到最大录音时长，自动停止');
                        stopRecording();
                    }
                }, maxRecordingTime);
                
                console.log('[startRecording] 录音已开始，状态:', mediaRecorder ? mediaRecorder.state : 'unknown');
                
                // 更新UI
                if (voiceBtn) {
                    voiceBtn.classList.add('recording');
                }
                if (voiceStatus) {
                    voiceStatus.textContent = '正在录音... (点击停止)';
                }
                
            } catch (error) {
                console.error('启动录音失败:', error);
                isRecording = false;
                
                let errorMsg = '无法访问麦克风';
                if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
                    errorMsg = '麦克风权限被拒绝，请在浏览器设置中允许';
                } else if (error.name === 'NotFoundError' || error.name === 'DevicesNotFoundError') {
                    errorMsg = '未找到麦克风设备';
                } else if (error.name === 'NotReadableError' || error.name === 'TrackStartError') {
                    errorMsg = '麦克风被其他应用占用';
                } else {
                    errorMsg = '录音失败: ' + error.message;
                }
                
                if (voiceStatus) {
                    voiceStatus.textContent = errorMsg;
                    setTimeout(() => {
                        if (voiceStatus) {
                            voiceStatus.textContent = '';
                        }
                    }, 3000);
                }
                
                // 清理
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                    currentStream = null;
                }
            }
        }

        // 停止录音
        function stopRecording() {
            console.log('[stopRecording] 停止录音，isRecording:', isRecording, 'mediaRecorder:', !!mediaRecorder);
            
            if (!isRecording) {
                console.log('[stopRecording] 未在录音，无需停止');
                return;
            }
            
            if (useDirectWavRecording && scriptProcessor) {
                // 停止Web Audio API录制（当前未使用，但保留代码）
                console.log('[stopRecording] 停止Web Audio API录制');
                scriptProcessor.disconnect();
                scriptProcessor = null;
                
                if (audioContext && audioContext.state !== 'closed') {
                    audioContext.close();
                }
                
                // 停止音频轨道
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                    currentStream = null;
                }
                
                isRecording = false;
                if (voiceBtn) {
                    voiceBtn.classList.remove('recording');
                }
                if (voiceStatus) {
                    voiceStatus.textContent = '正在识别...';
                }
                
                // 上传音频并识别
                uploadAndRecognize();
                return;
            }
            
            // 使用MediaRecorder停止录音
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                console.log('[stopRecording] 正在停止MediaRecorder，当前状态:', mediaRecorder.state);
                
                try {
                    mediaRecorder.stop();
                    isRecording = false;
                    
                    // 更新UI
                    if (voiceBtn) {
                        voiceBtn.classList.remove('recording');
                    }
                    if (voiceStatus) {
                        voiceStatus.textContent = '正在识别...';
                    }
                } catch (error) {
                    console.error('停止录音时出错:', error);
                    // 强制清理
                    if (currentStream) {
                        currentStream.getTracks().forEach(track => track.stop());
                        currentStream = null;
                    }
                    isRecording = false;
                    if (voiceBtn) {
                        voiceBtn.classList.remove('recording');
                    }
                }
            } else {
                // 如果没有MediaRecorder但stream还在运行，直接停止stream
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                    currentStream = null;
                }
                isRecording = false;
                if (voiceBtn) {
                    voiceBtn.classList.remove('recording');
                }
            }
        }

        // 从PCM数据直接生成WAV Blob（最快方式，无需转换）
        function createWavBlobFromPCM(bufferArray, sampleRate) {
            const length = bufferArray.reduce((sum, buffer) => sum + buffer.length, 0);
            const wavBuffer = new ArrayBuffer(44 + length * 2);
            const view = new DataView(wavBuffer);
            
            // WAV文件头
            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };
            
            writeString(0, 'RIFF');
            view.setUint32(4, 36 + length * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); // PCM
            view.setUint16(22, 1, true); // 单声道
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true); // 16位
            writeString(36, 'data');
            view.setUint32(40, length * 2, true);
            
            // 写入PCM数据
            let offset = 44;
            for (const buffer of bufferArray) {
                for (let i = 0; i < buffer.length; i++) {
                    const sample = Math.max(-1, Math.min(1, buffer[i]));
                    view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
                    offset += 2;
                }
            }
            
            return new Blob([wavBuffer], { type: 'audio/wav' });
        }

        // 上传音频并识别
        async function uploadAndRecognize() {
            try {
                let audioBlob;
                let extension = 'wav';
                
                // 优先使用直接录制的WAV格式（最快，无需转换）
                if (useDirectWavRecording && audioBufferArray.length > 0) {
                    console.log('使用直接录制的WAV格式，缓冲区数量:', audioBufferArray.length);
                    const sampleRate = audioContext ? (audioContext.sampleRate || 16000) : 16000;
                    audioBlob = createWavBlobFromPCM(audioBufferArray, sampleRate);
                    console.log('WAV Blob已创建，大小:', audioBlob.size, '字节 (', (audioBlob.size / 1024).toFixed(2), 'KB), 采样率:', sampleRate);
                    extension = 'wav';
                } else if (audioChunks.length > 0) {
                    // 使用MediaRecorder的数据
                    const mimeType = mediaRecorder ? mediaRecorder.mimeType : 'audio/webm';
                    console.log('[uploadAndRecognize] 创建音频Blob，类型:', mimeType, '块数量:', audioChunks.length);
                    
                    audioBlob = new Blob(audioChunks, { type: mimeType });
                    console.log('[uploadAndRecognize] 音频Blob已创建，大小:', audioBlob.size, '字节 (', (audioBlob.size / 1024).toFixed(2), 'KB)');
                    
                    // 根据mimeType确定扩展名，如果是webm/ogg等不支持格式，转换为wav
                    if (mimeType.includes('wav') || mimeType.includes('wave')) {
                        extension = 'wav';
                        console.log('[uploadAndRecognize] 使用WAV格式，无需转换');
                    } else if (mimeType.includes('mpeg') || mimeType.includes('mp3')) {
                        extension = 'mp3';
                        console.log('[uploadAndRecognize] 使用MP3格式，无需转换');
                    } else {
                        // webm/ogg等格式，需要转换为wav
                        console.log('[uploadAndRecognize] 检测到不支持的格式:', mimeType, '，开始转换为WAV...');
                        if (voiceStatus) {
                            voiceStatus.textContent = '正在转换音频格式...';
                        }
                        
                        try {
                            // 转换webm为wav
                            audioBlob = await convertToWav(audioBlob);
                            extension = 'wav';
                            console.log('[uploadAndRecognize] 音频已转换为WAV，大小:', audioBlob.size, '字节 (', (audioBlob.size / 1024).toFixed(2), 'KB)');
                        } catch (convertError) {
                            console.error('[uploadAndRecognize] 音频格式转换失败:', convertError);
                            if (voiceStatus) {
                                voiceStatus.textContent = '音频格式转换失败: ' + convertError.message;
                                setTimeout(() => {
                                    if (voiceStatus) voiceStatus.textContent = '';
                                }, 3000);
                            }
                            audioChunks = [];
                            audioBufferArray = [];
                            return;
                        }
                    }
                } else {
                    console.error('没有录音数据');
                    if (voiceStatus) {
                        voiceStatus.textContent = '未检测到录音数据，请重试';
                        setTimeout(() => {
                            if (voiceStatus) voiceStatus.textContent = '';
                        }, 3000);
                    }
                    audioChunks = [];
                    audioBufferArray = [];
                    return;
                }
                
                // 检查文件大小
                const maxSize = 25 * 1024 * 1024; // 25MB
                if (audioBlob.size > maxSize) {
                    console.warn('音频文件过大');
                    if (voiceStatus) {
                        voiceStatus.textContent = '音频文件过大，请缩短录音时长';
                        setTimeout(() => {
                            if (voiceStatus) voiceStatus.textContent = '';
                        }, 3000);
                    }
                    audioChunks = [];
                    audioBufferArray = [];
                    return;
                }
                
                if (audioBlob.size === 0) {
                    console.error('音频Blob为空');
                    if (voiceStatus) {
                        voiceStatus.textContent = '录音文件为空，请重试';
                        setTimeout(() => {
                            if (voiceStatus) voiceStatus.textContent = '';
                        }, 3000);
                    }
                    audioChunks = [];
                    audioBufferArray = [];
                    return;
                }
                
                // 创建FormData
                const formData = new FormData();
                formData.append('audio', audioBlob, `recording.${extension}`);
                
                // 清理音频数据
                audioChunks = [];
                audioBufferArray = [];
                
                console.log('开始上传音频，大小:', audioBlob.size, '字节 (', (audioBlob.size / 1024).toFixed(2), 'KB), 格式:', extension);
                
                // 更新状态显示
                if (voiceStatus) {
                    voiceStatus.textContent = '正在上传并识别...';
                }
                
                // 上传到后端API - 使用/api/chat作为备选方案
                // 添加超时控制（30秒）
                const controller = new AbortController();
                const timeoutId = setTimeout(() => {
                    controller.abort();
                }, 30000); // 30秒超时
                
                let apiUrl = '/api/speech/recognize';
                let response;
                
                try {
                    response = await fetch(apiUrl, {
                        method: 'POST',
                        body: formData,
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);
                    
                    // 如果404或400，尝试使用/api/chat（400可能是路由问题，404是路由不存在）
                    if (!response.ok && (response.status === 404 || response.status === 400)) {
                        console.log(`语音识别路由返回${response.status}，尝试使用/api/chat`);
                        apiUrl = '/api/chat';
                        
                        // 重新创建controller和timeout
                        const retryController = new AbortController();
                        const retryTimeoutId = setTimeout(() => {
                            retryController.abort();
                        }, 30000);
                        
                        try {
                            response = await fetch(apiUrl, {
                                method: 'POST',
                                body: formData,
                                signal: retryController.signal
                            });
                            clearTimeout(retryTimeoutId);
                        } catch (retryError) {
                            clearTimeout(retryTimeoutId);
                            if (retryError.name === 'AbortError') {
                                throw new Error('上传超时，请检查网络连接或缩短录音时长');
                            }
                            throw retryError;
                        }
                    }
                } catch (fetchError) {
                    clearTimeout(timeoutId);
                    if (fetchError.name === 'AbortError') {
                        throw new Error('上传超时（30秒），请检查网络连接或缩短录音时长');
                    }
                    throw fetchError;
                }
                
                console.log('收到响应，状态:', response.status, response.statusText);
                
                // 检查响应状态
                if (!response.ok) {
                    let errorText = '';
                    try {
                        errorText = await response.text();
                    } catch (e) {
                        errorText = '无法读取响应内容';
                    }
                    
                    let errorMsg = `服务器错误 (${response.status})`;
                    
                    // 尝试解析为JSON
                    try {
                        const errorJson = JSON.parse(errorText);
                        if (errorJson.error) {
                            errorMsg = errorJson.error;
                        } else if (errorJson.message) {
                            errorMsg = errorJson.message;
                        } else {
                            errorMsg = errorText.substring(0, 100); // 限制长度
                        }
                    } catch (e) {
                        // 不是JSON格式，可能是HTML错误页面
                        if (response.status === 404) {
                            errorMsg = 'API接口未找到，请检查服务器是否正常运行';
                        } else if (response.status === 500) {
                            errorMsg = '服务器内部错误，请查看服务器日志';
                        } else {
                            errorMsg = `服务器错误 (${response.status}): ${errorText.substring(0, 100)}`;
                        }
                    }
                    
                    throw new Error(errorMsg);
                }
                
                // 解析JSON响应
                let result;
                try {
                    const responseText = await response.text();
                    console.log('响应内容:', responseText.substring(0, 200));
                    result = JSON.parse(responseText);
                } catch (e) {
                    console.error('解析响应JSON失败:', e);
                    throw new Error('服务器返回格式错误，无法解析');
                }
                
                if (result.success) {
                    // 识别成功，填入输入框
                    console.log('识别成功，结果:', result.text);
                    
                    if (messageInput && result.text) {
                        messageInput.value = result.text;
                        // 触发input事件以确保UI更新
                        messageInput.dispatchEvent(new Event('input', { bubbles: true }));
                        messageInput.style.height = 'auto';
                        messageInput.style.height = messageInput.scrollHeight + 'px';
                        messageInput.focus();
                        
                        console.log('已填充到输入框:', result.text);
                    } else {
                        console.warn('messageInput或result.text为空', {
                            messageInput: !!messageInput,
                            text: result.text
                        });
                    }
                    
                    if (voiceStatus) {
                        voiceStatus.textContent = '识别成功 ✓';
                        setTimeout(() => {
                            if (voiceStatus) {
                                voiceStatus.textContent = '';
                            }
                        }, 2000);
                    }
                } else {
                    // 识别失败
                    const errorMsg = result.error || '识别失败，请重试';
                    if (voiceStatus) {
                        voiceStatus.textContent = errorMsg;
                        setTimeout(() => {
                            if (voiceStatus) {
                                voiceStatus.textContent = '';
                            }
                        }, 3000);
                    }
                    console.error('语音识别失败:', errorMsg);
                }
                
            } catch (error) {
                console.error('上传音频失败:', error);
                console.error('错误详情:', error.message, error.stack);
                
                let errorMsg = '上传失败';
                if (error.message) {
                    errorMsg = error.message;
                } else if (error.name === 'TypeError' && error.message.includes('fetch')) {
                    errorMsg = '网络连接失败，请检查网络或确认服务器是否运行';
                } else if (error.name === 'NetworkError') {
                    errorMsg = '网络错误，请检查网络连接';
                }
                
                if (voiceStatus) {
                    voiceStatus.textContent = errorMsg;
                    setTimeout(() => {
                        if (voiceStatus) {
                            voiceStatus.textContent = '';
                        }
                    }, 5000);
                }
            } finally {
                // 清空状态
                audioChunks = [];
                mediaRecorder = null;
                currentStream = null;
            }
        }
    </script>
